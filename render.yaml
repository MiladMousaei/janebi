services:
  - type: web
    name: janebi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/
    initialDeployHook: python manage.py seed_data
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janebi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,janebi-api
      - key: CORS_ALLOWED_ORIGINS
        value: https://janebi-store.onrender.com,https://testisite1.shop,https://www.testisite1.shop
      - key: FRONTEND_URL
        value: https://testisite1.shop
      - key: ADMIN_EMAIL
        value: admin@janebi.ir
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: KAVENEGAR_API_KEY
        sync: false

  - type: web
    name: janebi-store
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: INTERNAL_API_URL
        value: https://janebi-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        value: https://janebi-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://testisite1.shop

databases:
  - name: janebi-db
    plan: free
    region: frankfurt
    databaseName: janebi
    user: janebi
    postgresMajorVersion: "17"
    ipAllowList: []
